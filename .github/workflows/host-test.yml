name: Host tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: host-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-test:
    name: make host-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            python3

      - name: Run host tests
        run: make host-test

      - name: Remove host-test artifacts
        if: always()
        run: make clean-host
